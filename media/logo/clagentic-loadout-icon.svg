<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112">
  <defs>
    <linearGradient id="grad" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="104" y2="104">
      <stop offset="0%"   stop-color="#00CFFF"/>
      <stop offset="45%"  stop-color="#4A7FE8"/>
      <stop offset="100%" stop-color="#7B3FE4"/>
    </linearGradient>
  </defs>

  <!-- Standard terminal frame -->
  <rect x="8" y="8" width="96" height="96" rx="8" ry="8"
        fill="none" stroke="url(#grad)" stroke-width="4.5"/>

  <!-- Equipment rack: horizontal rail with three drop slots, two issued (filled item
       below the rail), one empty (open bracket only) — role gets exactly the kit
       it's issued, not the full rack. -->

  <!-- Rail -->
  <line x1="26" y1="34" x2="86" y2="34"
        stroke="url(#grad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Slot 1: issued item — filled rounded tab hanging from the rail -->
  <line x1="38" y1="34" x2="38" y2="44"
        stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="31" y="44" width="14" height="20" rx="3" ry="3"
        fill="url(#grad)" stroke="none"/>

  <!-- Slot 2: empty bracket — open, unfilled, dimmed (scoped-out capacity) -->
  <line x1="56" y1="34" x2="56" y2="44"
        stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <rect x="49" y="44" width="14" height="20" rx="3" ry="3"
        fill="none" stroke="url(#grad)" stroke-width="2" opacity="0.5"/>

  <!-- Slot 3: issued item — filled rounded tab hanging from the rail -->
  <line x1="74" y1="34" x2="74" y2="44"
        stroke="url(#grad)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="67" y="44" width="14" height="20" rx="3" ry="3"
        fill="url(#grad)" stroke="none"/>

  <!-- Base line: the kit sits on issued ground -->
  <line x1="26" y1="78" x2="86" y2="78"
        stroke="url(#grad)" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

</svg>
