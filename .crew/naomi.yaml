# .crew/naomi.yaml — NAOMI per-project configuration template
#
# Generated from: examples/starter-naomi.yaml (lr-e247)
# Schema: schemas/crew-config.schema.json
#
# DROP THIS FILE AT: <project-root>/.crew/naomi.yaml
# Then customize the sections below for your project.
#
# What this file does:
#   - Controls whether NAOMI may autonomously merge PRs in this project
#   - Declares what pre-checks must pass before NAOMI merges
#   - Sets reviewer requirements (must PEACHES have reviewed first?)
#
# What this file does NOT set for clagentic-loadout specifically:
#   - post_merge_steps: this repo's own merge executor (loadout-merge) never
#     reads them from here -- see the "post_merge_steps" section below for
#     why, and .clagentic/loadout/config.yaml for where they actually live.
#
# What this file does NOT do:
#   - Grant NAOMI authority (that comes from clagentic-directory merge-authority label)
#   - Change NAOMI's hard contract (AGENT.md governs that)
#   - Override the namespace guard (clagentic/* only; other namespaces refused)

schema_version: 1

# -----------------------------------------------------------------------
# merge_allowed
# -----------------------------------------------------------------------
# NAOMI requires this to be true to execute autonomous merges in this project.
#
#   merge_allowed: false  — NAOMI will refuse to merge in this project.
#     Use this during onboarding to keep human oversight until you trust
#     the pre-check suite.
#
#   merge_allowed: true   — NAOMI may merge after all pre-checks pass.
#     Requires: NAOMI holds merge-authority in clagentic-directory AND
#     all pre_checks below pass AND (if reviewer_required) PEACHES is clean.
#
merge_allowed: true

# -----------------------------------------------------------------------
# merge_requirements  (optional — additional merge gates)
# -----------------------------------------------------------------------
# Extra conditions NAOMI checks before merging. The default is:
#   tests_pass: true (NAOMI requires a clean test run)
#   ci_pass:    true (require green CI — set to false if you have no CI)
#
# ci_pass: false — this repo has NO CI and CI is 100% denied; it will never
# be stood up (operator decision, 2026-07-13, ratified). Loadout's own
# test suite (tests_pass) is THE gate for this repo — do not reintroduce a
# CI requirement here without a new operator decision.
merge_requirements:
  tests_pass: true
  ci_pass: false
  # max_files_changed: 50   # Escalate if a PR touches more than N files

# -----------------------------------------------------------------------
# reviewer_required  (optional — PEACHES review gate)
# -----------------------------------------------------------------------
# Whether NAOMI requires a PEACHES review.status: "clean" before merging.
#
#   true  (RECOMMENDED): NAOMI refuses if PEACHES returned blocking or if
#         no PEACHES review is present. This is the safe default.
#
#   false: NAOMI may merge without a prior PEACHES review. Only appropriate
#          for automated / no-PR repos or projects with full test coverage.
#
# NOTE: this field is not in the schema yet (tracked per lr-e247 followup).
# NAOMI honors it by convention; schema validation does not enforce it.
# reviewer_required: true

# -----------------------------------------------------------------------
# focus / avoid  (optional — prose guidance)
# -----------------------------------------------------------------------
# focus:
#   - "Only merge when CI is green — do not override"
# avoid:
#   - "Do not merge PRs that touch migration files without schema review"

# -----------------------------------------------------------------------
# post_merge_steps  (optional — post-merge automation)
# -----------------------------------------------------------------------
# REMOVED from this file (lr-db7db4): DEAD CONFIG, not a live second source
# of truth. loadout-merge (this package's own merge/verb.py) is THE LIVE
# NAOMI merge path on the clagentic-loadout PR flow (cutover ratified +
# landed: lr-c36be1, merge 071ad4a) and reads post_merge_steps EXCLUSIVELY
# from `.clagentic/loadout/config.yaml` via
# merge.post_merge_config.load_post_merge_steps (repo_config.py's
# DEFAULT_CONFIG_RELATIVE_PATH, with `.loadout/config.yaml` as its own
# documented legacy fallback) -- confirmed by reading merge/verb.py,
# merge/post_merge.py, and merge/post_merge_config.py directly: none of the
# three references ".crew" or "naomi.yaml" anywhere. A `post_merge_steps`
# key placed HERE was never executed by loadout-merge and was always inert
# for this repo's own merge flow; keeping a placeholder-valued entry here
# risked being mistaken for live config (see prior revision's own
# `PLACEHOLDERS -- replace both with this deployment's real values before
# use` note, which this repo's own real values never actually landed here
# against, precisely because this file is published and a real value here
# would ship -- the placeholder therefore could only ever be decorative).
# This repo's REAL, per-deployment post_merge_steps now lives at
# `.clagentic/loadout/config.yaml` -- gitignored, never committed, exactly
# like every other deployment on the loadout fleet (see that file's own
# header comment, and clagentic-gatekeeper's `.clagentic/loadout/
# config.yaml` for the precedent this repo now matches).
#
# on_failure: warn  — log and continue; cleanup steps must never block a merge.
# on_failure: fail  — exit EXIT_POST_MERGE_FAILED (blocks future steps).
#
# Example: deploy to staging after merge
# post_merge_steps:
#   - cmd: "make deploy-staging"
#     description: "Deploy to staging after merge"
#     on_failure: warn
