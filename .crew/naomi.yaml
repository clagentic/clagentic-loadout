# .crew/naomi.yaml — NAOMI per-project configuration template
#
# Generated from: examples/starter-naomi.yaml (lr-e247)
# Schema: schemas/crew-config.schema.json
#
# DROP THIS FILE AT: <project-root>/.crew/naomi.yaml
# Then customize the sections below for your project.
#
# What this file does:
#   - Controls whether NAOMI may autonomously merge PRs in this project
#   - Declares what pre-checks must pass before NAOMI merges
#   - Sets reviewer requirements (must PEACHES have reviewed first?)
#   - Sets optional post-merge steps
#
# What this file does NOT do:
#   - Grant NAOMI authority (that comes from clagentic-directory merge-authority label)
#   - Change NAOMI's hard contract (AGENT.md governs that)
#   - Override the namespace guard (clagentic/* only; other namespaces refused)

schema_version: 1

# -----------------------------------------------------------------------
# merge_allowed
# -----------------------------------------------------------------------
# NAOMI requires this to be true to execute autonomous merges in this project.
#
#   merge_allowed: false  — NAOMI will refuse to merge in this project.
#     Use this during onboarding to keep human oversight until you trust
#     the pre-check suite.
#
#   merge_allowed: true   — NAOMI may merge after all pre-checks pass.
#     Requires: NAOMI holds merge-authority in clagentic-directory AND
#     all pre_checks below pass AND (if reviewer_required) PEACHES is clean.
#
merge_allowed: true

# -----------------------------------------------------------------------
# merge_requirements  (optional — additional merge gates)
# -----------------------------------------------------------------------
# Extra conditions NAOMI checks before merging. The default is:
#   tests_pass: true (NAOMI requires a clean test run)
#   ci_pass:    true (require green CI — set to false if you have no CI)
#
# ci_pass: false — this repo has NO CI and CI is 100% denied; it will never
# be stood up (operator decision, 2026-07-13, ratified). Loadout's own
# test suite (tests_pass) is THE gate for this repo — do not reintroduce a
# CI requirement here without a new operator decision.
merge_requirements:
  tests_pass: true
  ci_pass: false
  # max_files_changed: 50   # Escalate if a PR touches more than N files

# -----------------------------------------------------------------------
# reviewer_required  (optional — PEACHES review gate)
# -----------------------------------------------------------------------
# Whether NAOMI requires a PEACHES review.status: "clean" before merging.
#
#   true  (RECOMMENDED): NAOMI refuses if PEACHES returned blocking or if
#         no PEACHES review is present. This is the safe default.
#
#   false: NAOMI may merge without a prior PEACHES review. Only appropriate
#          for automated / no-PR repos or projects with full test coverage.
#
# NOTE: this field is not in the schema yet (tracked per lr-e247 followup).
# NAOMI honors it by convention; schema validation does not enforce it.
# reviewer_required: true

# -----------------------------------------------------------------------
# focus / avoid  (optional — prose guidance)
# -----------------------------------------------------------------------
# focus:
#   - "Only merge when CI is green — do not override"
# avoid:
#   - "Do not merge PRs that touch migration files without schema review"

# -----------------------------------------------------------------------
# post_merge_steps  (optional — post-merge automation)
# -----------------------------------------------------------------------
# RETIRED on this repo's flow (lr-afba): an earlier internal merge tool is no
# longer what executes NAOMI's merges here. loadout-merge (this package's own
# merge/verb.py) is THE LIVE NAOMI merge path on the clagentic-loadout PR
# flow (cutover ratified + landed: lr-c36be1, merge 071ad4a — loadout-merge
# PRIMARY, the earlier tool demoted to a documented fallback, retained only
# for its own separate flow, not this repo's path). See lr-afba comments
# #11/#13 for the RETIRE evidence ledger (a sustained zero-fallback window of
# loadout-merge PRIMARY merges on this repo, each self-identifying via a
# forge-visible attestation comment).
#
# on_failure: warn  — log and continue; cleanup steps must never block a merge.
# on_failure: fail  — exit EXIT_POST_MERGE_FAILED (blocks future steps).
#
# Example: deploy to staging after merge
# post_merge_steps:
#   - cmd: "make deploy-staging"
#     description: "Deploy to staging after merge"
#     on_failure: warn
#
# Recommended: add working-state cleanup so NAOMI's clone stays tidy.
# loadout-merge runs post_merge_steps with cwd=project_root, so repo-relative
# paths work without hardcoding any absolute path. Pass '.' as the repo-root arg.
# post_merge_steps:
#   - cmd: "bash scripts/naomi-postmerge-clean.sh ."
#     description: "Post-merge working-state cleanup: checkout main, ff-pull, safe-prune merged branches (lr-1ec1)"
#     on_failure: warn
#
# self-install (lr-1ec9, retire-updated lr-afba): loadout-merge (the LIVE
# NAOMI merge path on this repo's flow) reads post_merge_steps from THIS
# file. The technical constraints below were established on an earlier
# internal merge tool's own path and PORTED, unchanged, into loadout-merge's
# own post_merge runner (merge.post_merge, lr-77d6) — they still apply
# exactly as written. Without an entry here, a NAOMI-executed merge installs
# nothing and the env is stuck on the pre-merge build (lr-52d7 exit-10
# recurrence). on_failure: fail so a broken install is a loud
# EXIT_POST_MERGE_FAILED, never a silent no-op that leaves the old binary on
# PATH. cmd is repo-relative (cwd=project_root, per loadout-merge's own
# run_post_merge_steps, which preserves the earlier tool's original
# contract).
#
# lr-52d7 (comment #2): the post_merge env does NOT reliably carry HOME
# (lr-e8cc) — this was first observed on that earlier merge tool's path (a
# merge where install.sh correctly refused a root-relative fallback and the
# step failed loud, EXIT_POST_MERGE_FAILED) and the same constraint was
# ported into loadout-merge's own runner. Fix mirrors the precedent set in
# clagentic-gatekeeper/.crew/naomi.yaml: supply the needed env INLINE in the
# cmd string via the leading VAR=VALUE prefix that the post_merge runner's
# argv resolver strips into the child env (shell=False, so this is NOT a
# shell expression — no shell operators are introduced). HOME=<deployment
# home dir> and --git-host-base-url <deployment git host base URL> below are
# PLACEHOLDERS — replace both with this deployment's real values before use.
# This file DOES ship when this repo is published (.crew/*.yaml ships by
# design, as disaster-recovery deployment config, alongside every other
# tracked file — publication has no exclusion mechanism, so real deployment
# values entered here would ship too; keep this file's values as
# placeholders and customize a local, untracked copy instead).
post_merge_steps:
  - cmd: "HOME=/path/to/deployment/home scripts/install.sh --git-host-base-url https://git.example.invalid"
    description: "self-install the merged build so loadout-git-host-api and the seeded git_host config.yaml are live for the next NAOMI-triggered spawn; HOME and --git-host-base-url are supplied inline here because the post_merge env does not reliably carry HOME (lr-e8cc, a constraint ported unchanged from an earlier internal merge tool's path into loadout-merge's own runner) — replace the placeholder values above with this deployment's real values (rule 1: never shipped in product code)"
    on_failure: fail
