# Repo profile: the shape this repository must keep. See docs/repo-profile.md.
# This repository ships as a released tool, so no environment-specific values
# (agent or deployment names, hosts, usernames, absolute host paths) may appear
# in it. The deployment's own denial list is user-level configuration and is
# deliberately not written here.
class: released-tool
# Risk posture, read by gates from the merge base (see docs/repo-profile.md). This
# repository is a library and CLI that runs locally or in CI, holds no private data,
# is published, and has no enforced review rule on its default branch.
exposure: local_or_ci_only
data: public_or_none
visibility: public
merge_control: unrestricted
confirmed_at: 2026-10-24
review:
  # The lighter docs-only review is open to a change that touches only these
  # paths. The files listed under depended_on are read as instructions by other
  # tools, so a change to one of them is reviewed as code.
  docs_only:
    paths: ["docs/**/*.md", "README.md"]
    depended_on: ["CLAUDE.md", "AGENTS.md", "docs/README.md"]
  # Security scanners a review run executes, each mapped to the finding
  # category its hits are posted under. A scanner not named here is reported
  # as degraded instead of categorized (see docs/scanner-input.md).
  scanners:
    gitleaks: {category: secrets_exposure}
    trufflehog: {category: secrets_exposure}
    semgrep: {category: injection}
    osv-scanner: {category: supply_chain}
  # A process-record rule (a compliance record a person can supply) that the
  # reviewer which raised it may clear itself; see docs/repo-profile.md.
  clearance:
    process_record:
      rule_ids: ["*.path-choice.5"]
paths:
  # Deployment config that ships as disaster-recovery data and carries its own
  # cast identifiers by design.
  ".crew/**": {class: internal}
# What `clagentic-loadout test run` executes; see docs/repo-test.md.
test:
  full: [python3, -m, pytest, "--junitxml={junit}"]
  files: [python3, -m, pytest, "--junitxml={junit}"]
