# The interface this repository declares to its consumers: what other tools may
# rely on. Removing or renaming an element, or changing an exit code's number, is
# a breaking change; adding one is not. The shape is documented in docs/interface.md
# and tests/test_interface_self.py fails when this file and the code disagree.
